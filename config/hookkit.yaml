# hookkit 配置
#
# 语义：把「无边框全屏」窗口的几何来源从显示器整块区域（rcMonitor）改为
# 工作区（rcWork），使窗口避开任务栏。依据 stellaris_borderless_fullscreen_trace.md：
#   - 窗口尺寸来自 GDI32!GetDeviceCaps(hdc, HORZRES/VERTRES) -> SDL desktop_mode
#   - 窗口位置来自 USER32!GetMonitorInfoW -> rcMonitor -> SDL_WINDOWPOS_CENTERED 居中
# 因此两处同时改为 work_area，居中结果正好落在 rcWork 内。

enabled: true

targets:
  - executable: stellaris.exe
    enabled: true

    # 适配策略：提供与目标版本绑定的已知调用点表（RVA）。
    strategy: sdl2-gdi
    # 目标几何语义：work_area（rcWork）/ monitor（rcMonitor，等价不修改）。
    geometry: work_area

    # hook 组件表：键名与组件注册名一致，未列出的组件不安装。
    hooks:
      GetDeviceCaps:
        enabled: true
        indices:
          - HORZRES
          - VERTRES
        scope: callsite

      GetMonitorInfoW:
        enabled: true
        fields:
          rcMonitor: rcWork
        scope: callsite

    safety:
      # 条件不满足（未配置 / 调用点校验失败 / 无法定位显示器）时的行为。
      fallback: passthrough
      # 安装前按 strategy 的 RVA 校验调用点字节与 IAT 槽，防止 exe 版本变化后误改。
      verify_callsite: true
