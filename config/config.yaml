# WorkAreaFullscreen 配置
# 由界面保存时重写；手工编辑后程序会自动热重载。
#
# geometry          work_area = 窗口铺满工作区（保留任务栏）；monitor = 显示器整块区域
# 启动代理的挂载状态存放在注册表（IFEO）里，不写进本文件。

enabled: true

ui:
  minimize_to_tray: true

targets:
  - executable: stellaris.exe
    enabled: true
    strategy: sdl2-gdi
    geometry: work_area
    hooks:
      GetMonitorInfoW:
        enabled: true
        fields:
          rcMonitor: rcWork
        scope: callsite
      GetDeviceCaps:
        enabled: true
        indices:
          - HORZRES
          - VERTRES
        scope: callsite
      EnumDisplaySettingsW:
        enabled: true
        scope: global
    safety:
      verify_callsite: true
